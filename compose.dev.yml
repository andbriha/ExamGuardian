services:
  api:
    build:
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
    volumes:
      - ./Core:/workspace
      - core_artifacts:/build
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 60s
  ai_service:
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./Inference:/app:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/api", "--reload-dir", "/app/core", "--reload-dir", "/app/models"]
  monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile.dev
    volumes:
      - ./monitor/src:/workspace/src:ro
      - ./monitor/public:/workspace/public:ro
    networks: [app_network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  nginx:
    image: nginx:alpine
    build: !reset null
    volumes:
      - ./monitor/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Landing:/usr/share/nginx/html/landing:ro
      - ./Landing.dev:/opt/dev-downloads:ro

    depends_on:
      ai_service:
        condition: service_started
      monitor:
        condition: service_healthy
  docs:
    build:
      context: ./web-site
      dockerfile: Dockerfile.dev
    volumes:
      - ./web-site/src:/workspace/src:ro
    ports:
      - "127.0.0.1:${DOCS_PORT:-4321}:4321"
    networks: [app_network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/docs/09-deployment-view').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
volumes:
  core_artifacts:
