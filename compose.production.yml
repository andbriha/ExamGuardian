services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  nginx:
    ports: !override
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./monitor/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIRECTORY:?Configure TLS_DIRECTORY}:/etc/nginx/tls:ro
