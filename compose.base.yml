services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. C# Backend API
  api:
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    build:
      context: ./Core
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ForwardedHeaders__KnownProxies__0=${PROXY_IP:-172.30.0.10}
      - Exam__TimeZone=${EXAM_TIME_ZONE:-Europe/Chisinau}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt__Key=${JWT__KEY}
      - Jwt__Issuer=${JWT__ISSUER}
      - Jwt__Audience=${JWT__AUDIENCE}
      - Jwt__LifetimeMinutes=${JWT__LIFETIME_MINUTES:-15}
      - AiService__ApiKey=${AiService__ApiKey}
      - INFERENCE_IMAGES_PATH=/app/InferenceImages
      - EXAM_VIDEO_PATH=/app/ExamVideos
      - CredentialKeysPath=/app/credential-keys
      - Bootstrap__ExaminerLogin=${BOOTSTRAP_EXAMINER_LOGIN:-}
      - Bootstrap__ExaminerPassword=${BOOTSTRAP_EXAMINER_PASSWORD:-}
      - Seed__DemoExam=${SEED_DEMO_EXAM:-false}
    volumes:
      - shared_images:/app/InferenceImages
      - exam_videos:/app/ExamVideos
      - credential_keys:/app/credential-keys
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  # 3. Python AI Microservice
  ai_service:
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    build:
      context: ./Inference
      dockerfile: Dockerfile
    environment:
      - CORE_API_URL=http://api:8080/api/violations
      - AI_API_KEY=${AiService__ApiKey}
      - API_URL=http://api:8080/api
      - API_KEY=${AiService__ApiKey}
      - JWT_JWKS_URL=http://api:8080/.well-known/jwks.json
      - JWT__ISSUER=${JWT__ISSUER}
      - JWT__AUDIENCE=${JWT__AUDIENCE}
      - INFERENCE_IMAGES_PATH=/app/images
      - INFERENCE_QUEUE_LIMIT=${INFERENCE_QUEUE_LIMIT:-16}
      - INFERENCE_WAIT_SECONDS=${INFERENCE_WAIT_SECONDS:-5}
    volumes:
      - shared_images:/app/images
      - deepface_cache:/home/app/.deepface
      - inference_state:/app/state
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      api:
        condition: service_healthy

  # 4. Angular Monitor & Landing (Nginx)
  nginx:
    build:
      context: ./monitor
      dockerfile: Dockerfile
      args:
        # Pass the URL from .env to the sed command in Dockerfile
        BACKEND_URL: /api
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8081}:80"
    volumes:
      - ./monitor/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Map the static landing page folder
      - ./Landing:/usr/share/nginx/html/landing:ro
    networks:
      app_network:
        ipv4_address: ${PROXY_IP:-172.30.0.10}
    depends_on:
      api:
        condition: service_healthy
      ai_service:
        condition: service_healthy

volumes:
  credential_keys:
  exam_videos:
  postgres_data:
  shared_images:
  deepface_cache:
  inference_state:

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.0.0/24}
