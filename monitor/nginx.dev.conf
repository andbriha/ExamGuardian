log_format evidence_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
access_log /var/log/nginx/access.log evidence_safe;
server {
  listen 80;
  # Keep redirects relative: the external loopback port differs from port 80 here.
  absolute_redirect off;
  client_max_body_size 128M;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  proxy_read_timeout 120s;
  location /api/ { proxy_pass http://api:8080/api/; proxy_set_header Host $http_host; }
  location ~ ^/(verify|analyze)/ { proxy_pass http://ai_service:8000; }
  location = / { return 302 /landing/; }
  location = /landing/Online_Proctoring_System_Setup.exe {
    alias /usr/share/nginx/html/landing/ExamGuardian_Setup_Dev.exe;
    add_header Content-Disposition 'attachment; filename="ExamGuardian_Setup_Dev.exe"';
    add_header Cache-Control 'no-store';
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  }
  location = /landing/Online_Proctoring_System_Client.exe {
    return 302 /landing/Online_Proctoring_System_Client.zip;
    add_header Cache-Control 'no-store';
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  }
  location = /landing/ExamGuardian_Client_Dev.exe { return 302 /landing/Online_Proctoring_System_Client.zip; }
  location = /landing/Online_Proctoring_System_Client.zip {
    alias /usr/share/nginx/html/landing/ExamGuardian_Client_Dev.zip;
    add_header Content-Disposition 'attachment; filename="ExamGuardian_Client_Dev.zip"';
    add_header Cache-Control 'no-store';
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  }
  location ~* ^/landing/.*_Prod\.(exe|zip|json)$ { return 404; }
  location ~* ^/landing/.*\.(exe|zip|json)$ { root /usr/share/nginx/html; try_files $uri =404; add_header Cache-Control 'no-store';  add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; }
  location /landing/ { root /usr/share/nginx/html; try_files $uri $uri/ /landing/index.html; }
  location / { proxy_pass http://monitor:4200; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; }
}
