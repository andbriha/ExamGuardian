server {
  listen 80;
  # Keep redirects relative: the external loopback port differs from port 80 here.
  absolute_redirect off;
  client_max_body_size 128M;
  proxy_read_timeout 120s;
  add_header X-Content-Type-Options nosniff always;
  location /api/ { proxy_pass http://api:8080/api/; proxy_set_header Host $http_host; }
  location ~ ^/(verify|analyze)/ { proxy_pass http://ai_service:8000; }
  location = / { return 302 /landing/; }
  location = /landing/Online_Proctoring_System_Setup.exe { alias /opt/dev-downloads/ExamGuardian_Dev_Setup.exe; }
  location = /landing/Online_Proctoring_System_Client.exe { alias /opt/dev-downloads/Online_Proctoring_System_Client.exe; }
  location /landing/ { root /usr/share/nginx/html; try_files $uri $uri/ /landing/index.html; }
  location / { proxy_pass http://monitor:4200; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; }
}
