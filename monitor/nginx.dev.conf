server {
  listen 80;
  # Keep redirects relative: the external loopback port differs from port 80 here.
  absolute_redirect off;
  client_max_body_size 128M;
  proxy_read_timeout 120s;
  add_header X-Content-Type-Options nosniff always;
  location /api/ { proxy_pass http://api:8080/api/; proxy_set_header Host $http_host; }
  location ~ ^/(verify|analyze)/ { proxy_pass http://ai_service:8000; }
  location = / { return 302 /landing/; }
  location = /landing/Online_Proctoring_System_Setup.exe {
    alias /usr/share/nginx/html/landing/ExamGuardian_Setup_Dev.exe;
    add_header Content-Disposition 'attachment; filename="ExamGuardian_Setup_Dev.exe"';
    add_header Cache-Control 'no-store';
  }
  location = /landing/Online_Proctoring_System_Client.exe {
    alias /usr/share/nginx/html/landing/ExamGuardian_Client_Dev.exe;
    add_header Content-Disposition 'attachment; filename="ExamGuardian_Client_Dev.exe"';
    add_header Cache-Control 'no-store';
  }
  location = /landing/Online_Proctoring_System_Client.zip {
    alias /usr/share/nginx/html/landing/ExamGuardian_Client_Dev.zip;
    add_header Content-Disposition 'attachment; filename="ExamGuardian_Client_Dev.zip"';
    add_header Cache-Control 'no-store';
  }
  location ~* ^/landing/.*_Prod\.(exe|zip|json)$ { return 404; }
  location ~* ^/landing/.*\.(exe|zip|json)$ { root /usr/share/nginx/html; try_files $uri =404; add_header Cache-Control 'no-store'; }
  location /landing/ { root /usr/share/nginx/html; try_files $uri $uri/ /landing/index.html; }
  location / { proxy_pass http://monitor:4200; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; }
}
