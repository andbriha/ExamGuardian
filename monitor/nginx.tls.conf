server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128M;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location ~ ^/(verify|analyze)/ {
        proxy_pass http://ai_service:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location = / { return 302 /landing/; }
    location = /landing { return 301 /landing/; }
    location = /landing/Online_Proctoring_System_Setup.exe {
        alias /usr/share/nginx/html/landing/ExamGuardian_Setup_Prod.exe;
        add_header Content-Disposition 'attachment; filename="ExamGuardian_Setup_Prod.exe"';
        add_header Cache-Control 'no-store';
    }
    location = /landing/Online_Proctoring_System_Client.exe {
        alias /usr/share/nginx/html/landing/ExamGuardian_Client_Prod.exe;
        add_header Content-Disposition 'attachment; filename="ExamGuardian_Client_Prod.exe"';
        add_header Cache-Control 'no-store';
    }
    location = /landing/Online_Proctoring_System_Client.zip {
        alias /usr/share/nginx/html/landing/ExamGuardian_Client_Prod.zip;
        add_header Content-Disposition 'attachment; filename="ExamGuardian_Client_Prod.zip"';
        add_header Cache-Control 'no-store';
    }
    location ~* ^/landing/.*_Dev\.(exe|zip|json)$ { return 404; }
    location ~* ^/landing/.*\.(exe|zip|json)$ { root /usr/share/nginx/html; try_files $uri =404; add_header Cache-Control 'no-store'; }
    location /landing/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /landing/index.html =404;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
