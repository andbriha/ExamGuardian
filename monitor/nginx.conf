server {
    listen 80;
    server_name localhost;

    client_max_body_size 128M;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    proxy_read_timeout 120s;

    # 1. ASP.NET Core Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. FastAPI AI Engine Reverse Proxy (Liveness challenge, verification & continuous inference)
    location ~ ^/(verify|analyze)/ {
        proxy_pass http://ai_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Student Portal Entrypoint: Redirect root "/" immediately to Student Portal
    location = / {
        return 302 /landing/;
    }

    # 4. Static Landing Page & Desktop Client Downloads (/landing/*)
    location /landing/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /landing/index.html =404;
    }

    location = /landing {
        return 301 /landing/;
    }

    # 5. Angular SPA Monitor Dashboard (for proctors: /login, /exams, /monitoring, /reports, etc.)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}